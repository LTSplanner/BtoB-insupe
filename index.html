<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>内覧会 スケジュール調整</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="内覧会スケジュール">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --text:#1d2329; --sub:#6b7480;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --int:#0f9d76; --int-soft:#e7f6f1;
  --ext:#d97706; --ext-soft:#fdf3e3;
  --req:#7c3aed; --req-soft:#f3edff;
  --ng:#dc2626; --ng-soft:#fdecec;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
header{background:#111827;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .tag{font-size:11px;background:#374151;padding:2px 8px;border-radius:99px;color:#d1d5db}
nav{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:none;padding:12px 14px;font-size:14px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:6px}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav .n{background:var(--req);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;font-weight:700}
main{padding:20px;max-width:1400px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:13px;margin:16px 0 8px;color:var(--sub)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
textarea{width:100%;min-height:150px;line-height:1.7}
button.btn{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.btn:hover{background:#f3f4f6}
button.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.btn.pri:hover{filter:brightness(1.1)}
button.btn.ok{background:var(--int);color:#fff;border-color:var(--int)}
button.btn.danger{color:var(--ng);border-color:#f3c9c9}
button.btn.sm{padding:4px 9px;font-size:12px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--sub);font-size:12px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center}
table.grid th.name,table.grid td.name{text-align:left;padding:6px 10px;white-space:nowrap;position:sticky;left:0;background:var(--panel);z-index:2;border-right:1px solid var(--line)}
table.grid thead th{background:#fafbfc;padding:6px 4px;font-weight:600;font-size:12px}
table.grid thead th .dnum{font-size:15px}
table.grid thead th.we{color:var(--ng)}
table.grid thead th.sa{color:var(--accent)}
.cell{width:100%;height:38px;border:none;background:none;cursor:pointer;font-size:15px;font-family:inherit;color:#c4c9cf}
.cell:hover{background:#f1f5f9}
.cell.hold{background:var(--int-soft);color:var(--int);font-weight:700}
.cell.confirmed{background:var(--ext-soft);color:var(--ext);font-weight:700}
.cell.requested{background:var(--req-soft);color:var(--req);font-weight:700;font-size:12px}
.cell.ng{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 4px,#f1f1f1 4px,#f1f1f1 8px);cursor:not-allowed;color:#dfe3e7}
.cell.off{background:#eceff3;color:#98a0aa;cursor:not-allowed;font-size:12px;font-weight:700}
.cell.conflict{background:var(--ng-soft) !important;color:var(--ng) !important}
.grp{background:#f0f2f5;font-size:11px;color:var(--sub);padding:4px 10px;text-align:left;font-weight:600;letter-spacing:.04em}
.cap{font-size:11px;font-weight:700}
.cap.ok{color:var(--int)} .cap.short{color:var(--ext)} .cap.over{color:var(--ng)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;background:#fff;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.full{background:#f4f4f5;color:#b6bbc1;cursor:not-allowed;text-decoration:line-through}
.chip.req{background:var(--req-soft);border-color:var(--req);color:var(--req);font-weight:700}
.chip.cfm{background:var(--ext-soft);border-color:var(--ext);color:var(--ext);font-weight:700}
.alert{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;border:1px solid}
.alert.err{background:var(--ng-soft);border-color:#f3c9c9;color:#a01f1f}
.alert.warn{background:#fff8e6;border-color:#f2dfae;color:#8a6100}
.alert.ok{background:var(--int-soft);border-color:#b9e5d7;color:#0a6b51}
.alert.info{background:var(--req-soft);border-color:#ddd0f7;color:#5b21b6}
.plist{display:grid;gap:10px}
.pitem{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;background:#fff}
.pitem:hover{border-color:var(--accent);background:var(--accent-soft)}
.pitem.on{border-color:var(--accent);border-width:2px;background:var(--accent-soft)}
.pitem b{font-size:15px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#eef0f3;color:var(--sub)}
.badge.st-調整中{background:#fff3d6;color:#8a6100}
.badge.st-確定{background:var(--int-soft);color:var(--int)}
.badge.st-図面待ち{background:#eef0f3;color:var(--sub)}
.badge.st-完了{background:#eef0f3;color:#9aa2ab}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.legend span i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.kv{display:flex;gap:8px;font-size:13px;padding:3px 0}
.kv b{width:90px;color:var(--sub);font-weight:400;flex-shrink:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font-family:inherit;font-size:13px;color:var(--accent);cursor:pointer;padding:0;margin-bottom:10px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.task:last-child{border-bottom:none}
.task input{margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:var(--int)}
.task.done>span{color:var(--sub);text-decoration:line-through;text-decoration-color:#c9ced4}
.task.done .muted{text-decoration:none}
.bar{display:inline-block;width:110px;height:7px;background:var(--line);border-radius:99px;overflow:hidden;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--int);border-radius:99px}
.minibar{display:inline-block;width:70px;height:5px;background:var(--line);border-radius:99px;overflow:hidden;vertical-align:middle;margin:0 6px}
.minibar i{display:block;height:100%;background:var(--int)}
.back:hover{text-decoration:underline}
.reqrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.reqrow:last-child{border-bottom:none}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">内覧会 スケジュール調整</h1>
  <span class="tag">プロトタイプ v0.3</span>
  <span class="tag" id="ruleTag"></span>
  <span class="tag" id="syncTag" style="margin-left:auto" hidden></span>
  <span class="tag" id="netTag"></span>
  <button class="btn sm" id="installBtn" hidden onclick="doInstall()">アプリとして追加</button>
</header>
<nav>
  <button data-tab="board" class="on">調整ボード</button>
  <button data-tab="approve">申請の承認 <span class="n" id="nReq"></span></button>
  <button data-tab="props">物件</button>
  <button data-tab="book">予約画面（インスペさん）</button>
  <button data-tab="msg">連絡文・カレンダー</button>
  <button data-tab="members">メンバー / ルール</button>
</nav>
<main>
  <section id="tab-board"></section>
  <section id="tab-approve" hidden></section>
  <section id="tab-props" hidden></section>
  <section id="tab-book" hidden></section>
  <section id="tab-msg" hidden></section>
  <section id="tab-members" hidden></section>
</main>

<script src="data.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ============================================================
   ドメインモデル
   ------------------------------------------------------------
   Assignment.status
     hold      : 自社スタッフの仮押さえ（枠を消費する）
     requested : 外部インスペからの希望申請（枠を消費しない・重複可）
     confirmed : 確定（枠を消費する）
   ============================================================ */
const RULES_DEFAULT = {
  maxPerDay: 2,               // 1日あたり最大2名（アカウントの関係・厳守）
  maxExternalPerProperty: 2,  // 外部インスペ：1棟あたり最大2名（厳守）
  maxExternalPerDay: 2,       // 外部インスペ：1日あたり最大2名（厳守）
  defaultNeeded: 4,           // 1棟あたりの必要のべ人数（1F3部屋＋共用12部屋＋4F共用＋外構 で4名がベース）
  roomsPerPerson: 3,          // 3部屋＋共用部で1人ベース
  countTrainees: false,       // 研修中スタッフを1日2名の人数に数えるか（既定：数えない）
  traineesPerRegular: 1,      // 研修中：正規メンバー1名につき同行できる人数（例：正規2名の日は研修2名まで）
  graduateAfter: 5,           // 研修→正規メンバーの目安（この棟数を対応したら切り替えを検討）
  workStart: '09:00',         // カレンダー予定の開始時刻
  workEnd:   '18:00',         // カレンダー予定の終了時刻
  // 打診は「先方から日付が届き始めたらすぐ」開始してよい（＝検査期間が入った時点で打診可）
  // Googleカレンダーの予定タイトル。実際の運用に合わせた形式
  titleTemplate: '{名前}さん　{元請け}　{コード}　{住所}'
};

const D = (typeof window!=='undefined' && window.APP_DATA) || {};
const SEED_MEMBERS = D.members || [];
const ORGANIZER = D.organizer || '';
const CLIENT = D.clientName || '元請け';      // 発注元の名前（data.js が無ければ伏せる）
const SENDER = D.senderName || '弊社';        // 連絡文の差出人
/* 既存スケジュール（data.js から読み込む。公開ページでは空） */
const PAPAMAHALO = D.papamahalo || [];
/* "MM-DD" を物件の年に合わせて "YYYY-MM-DD" に戻す（年をまたぐ物件に対応） */
function md2date(r, md){
  const y1 = r.start.slice(0,4), y2 = r.end.slice(0,4);
  const c1 = y1+'-'+md;
  return (c1>=r.start && c1<=r.end) ? c1 : y2+'-'+md;
}
const EXT_IDS = ['sugihara','kon','ito'];
/* 1件ぶんを物件＋アサインに展開 */
function expand(r, today){
  const hasExt = Object.keys(r.a||{}).some(function(m){ return EXT_IDS.indexOf(m)>=0; });
  const prop = {id:'pm-'+r.code, name:r.addr, address:r.addr, code:r.code, units:'', note:r.note||'',
    status: r.end<today ? '完了' : (hasExt?'確定':'調整中'),
    start:r.start, end:r.end, report:r.report||'', rooms:null, needed:RULES_DEFAULT.defaultNeeded, history:[]};
  const asg = [];
  Object.keys(r.a||{}).forEach(function(mid){
    r.a[mid].forEach(function(md){
      asg.push({id:uid(), propertyId:prop.id, memberId:mid, date:md2date(r,md),
                status: EXT_IDS.indexOf(mid)>=0 ? 'confirmed' : 'hold'});
    });
  });
  return {prop, asg};
}
/* 登録済みのものは飛ばして追加読み込み */
function importPapamahalo(){
  const today = d2s(new Date());
  let added=0, skipped=0;
  PAPAMAHALO.forEach(function(r){
    if(S.properties.some(function(p){return p.code===r.code})){ skipped++; return; }
    const e = expand(r, today);
    S.properties.push(e.prop);
    e.asg.forEach(function(a){ S.assignments.push(a); });
    added++;
  });
  save(); render();
  alert(added+'件を読み込みました。'+(skipped?'（'+skipped+'件は登録済みのためスキップ）':''));
}

const FRESH = !load();
let S = load() || {
  members: SEED_MEMBERS,
  rules: {...RULES_DEFAULT},
  properties: [],
  assignments: [],
  offs: [],                       // 自社スタッフのOFF … {memberId, date, reason}
  tasks: {},                      // 物件ごとの業務チェック … {propertyId:{taskKey:true}}
  ui: {curProp:'', bookAs:'sugihara'}
};
S.rules = {...RULES_DEFAULT, ...S.rules};
/* 旧データの移行：区分'trainee' → 自社スタッフ＋研修フラグ（研修は成長段階なので区分ではなくON/OFFで持つ） */
(S.members||[]).forEach(m=>{
  if(m.type==='trainee'){ m.type='internal'; m.trainee=true; }
  if(m.trainee===undefined) m.trainee=false;
});
if(!S.offs) S.offs = [];
if(!S.tasks) S.tasks = {};

function saveLocal(){ localStorage.setItem('pm_sched_v3', JSON.stringify(S)); }
function save(){ saveLocal(); if(window.SYNC && SYNC.push) SYNC.push(S); }
/* 同期レイヤー（sync.js）から中身を差し替えるための入口。
   受信したときは save() を呼ばない（送り返さないため） */
window.__app = {
  get S(){ return S; },
  setColl(c, arr){ S[c] = arr; saveLocal(); },
  setRules(r){ S.rules = {...RULES_DEFAULT, ...r}; saveLocal(); },
  setTasks(t){ S.tasks = t || {}; saveLocal(); },
  render(){ render(); }
};
function load(){ try{ return JSON.parse(localStorage.getItem('pm_sched_v3')); }catch(e){ return null; } }
const uid = () => Math.random().toString(36).slice(2,9);

/* ---- 日付 ---- */
const WD = ['日','月','火','水','木','金','土'];
function d2s(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function s2d(s){ const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); }
function fmt(s){ const d=s2d(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; }
function fmtLong(s){ const d=s2d(s); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; }
function range(start,end){ const out=[]; const d=s2d(start), e=s2d(end); while(d<=e){ out.push(d2s(d)); d.setDate(d.getDate()+1); } return out; }
function addDays(s,n){ const d=s2d(s); d.setDate(d.getDate()+n); return d2s(d); }

/* ---- 参照 ---- */
const M  = id => S.members.find(m=>m.id===id);
const P  = id => S.properties.find(p=>p.id===id);
const curP = () => P(S.ui.curProp) || S.properties[0];
const asgOf = pid => S.assignments.filter(a=>a.propertyId===pid);
const find = (pid,mid,date) => S.assignments.find(a=>a.propertyId===pid&&a.memberId===mid&&a.date===date);
const isExt = mid => M(mid).type==='external';
const isTrainee = mid => !!(M(mid)||{}).trainee;
/* 正規メンバー＝研修中でない人（自社・外部を問わない） */
const isRegular = mid => !isTrainee(mid);
/* 人数としてカウントするか（研修中は既定でカウントしない） */
const counts = a => a.status!=='requested' && (S.rules.countTrainees || !isTrainee(a.memberId));
/* 枠を消費しているアサイン（hold + confirmed） */
const booked = (pid,date) => asgOf(pid).filter(a=>a.date===date && counts(a));
/* 研修中を含めた その日の全員（希望申請は除く） */
const onDay = (pid,date) => asgOf(pid).filter(a=>a.date===date && a.status!=='requested');
/* 研修中が同行できる上限＝その日の正規メンバー数 × 正規1名あたりの人数 */
const traineeCap = (pid,date) => onDay(pid,date).filter(a=>isRegular(a.memberId)).length * (S.rules.traineesPerRegular||1);
/* 研修中の対応棟数（希望申請は除く。5棟で正規メンバーへの切り替えを検討する） */
const propsDone = mid => new Set(S.assignments.filter(a=>a.memberId===mid && a.status!=='requested').map(a=>a.propertyId)).size;
const extConfirmedIn = pid => [...new Set(asgOf(pid).filter(a=>a.status==='confirmed'&&isExt(a.memberId)).map(a=>a.memberId))];

/* ---- 必要のべ人数 ---- */
const needOf = p => p.needed || S.rules.defaultNeeded;
/* 枠を消費しているアサインの合計（＝のべ何名確保できたか） */
const totalBooked = pid => asgOf(pid).filter(counts).length;
/* 部屋数から必要のべ人数を出す（3部屋＋共用部で1人ベース） */
const neededFromRooms = rooms => Math.max(1, Math.ceil(rooms / S.rules.roomsPerPerson));

/* ---- 物件コード（260724-0726 形式）と予定タイトル ---- */
function autoCode(s,e){ return s.replace(/-/g,'').slice(2)+'-'+e.replace(/-/g,'').slice(4); }
const pcode = p => p.code || autoCode(p.start,p.end);
/* 報告書提出日つきのコード（例：270222-0224(0225)）。工程表の赤いマス＝報告書の日 */
const pcodeR = p => pcode(p) + (p.report ? `(${p.report.replace(/-/g,'').slice(4)})` : '');
/* ドライブのフォルダ名／カレンダーの予定タイトルに使う登録名 */
const regName = p => `${CLIENT}　${pcodeR(p)}　${p.name}`;
function evTitle(p,m){
  return (S.rules.titleTemplate||'{名前}さん　{元請け}　{コード}　{住所}')
    .replace('{名前}', m?m.name:'').replace('{元請け}', CLIENT).replace('{コード}', pcode(p))
    .replace('{コード＋報告書}', pcodeR(p)).replace('{報告書}', p.report?p.report.replace(/-/g,'').slice(4):'')
    .replace('{住所}', p.address||'').replace('{物件名}', p.name||'');
}
/* データが空のときの案内 */
function emptyState(){
  return backBar()+`<div class="card">
    <h2>まだデータがありません</h2>
    <div class="muted">この端末には物件が登録されていません。次のどちらかで始めてください。</div>
    <div class="row" style="margin-top:12px;gap:8px">
      <label class="btn pri" style="margin:0">バックアップファイルから復元
        <input type="file" accept="application/json,.json" style="display:none" onchange="restore(this)"></label>
      <button class="btn" onclick="go('props')">物件を手入力で登録する</button>
    </div>
    <div class="muted" style="margin-top:12px">※ Macで使っている方の「メンバー / ルール」→「バックアップを保存」で作ったファイルを読み込むと、そのまま続きから使えます。</div>
  </div>`;
}
function sampleTitle(){
  const ex = S.members.filter(m=>m.type==='external')[0];
  if(!S.properties.length || !ex) return '〇〇さん　'+CLIENT+'　261022-1025　〇〇1丁目';
  return evTitle(curP(), ex);
}

/* 物件切り替えのプルダウン */
function propSelect(){
  const sorted = S.properties.slice().sort((a,b)=>a.start<b.start?-1:1);
  return `<select onchange="S.ui.curProp=this.value;save();render()" style="max-width:340px">
    ${sorted.map(x=>`<option value="${x.id}" ${x.id===S.ui.curProp?'selected':''}>${pcode(x)}　${x.name}</option>`).join('')}
  </select>`;
}

/* ------------------------------------------------------------
   物件ごとの業務チェックリスト（スプレッドシート「業務の棚卸し」より）
   auto があるものはアプリの状態から自動で判定する
   ------------------------------------------------------------ */
const TASKS = [
  {k:'docs',   label:'資料一式を受領（意匠図・工程表）'},
  {k:'folder', label:'案件ドライブにフォルダ作成', hint:'フォルダ名は「コード　物件住所名」で統一'},

  {k:'pdf',    label:'図面を部屋ごとに切り抜き→PDF変換', hint:'12部屋＋共用部4F分＋外構＝17。ピロティは外構にまとめる'},
  {k:'hold',   label:'LTSスタッフでカレンダーを抑える', auto:p=>totalBooked(p.id)>=needOf(p)},
  {k:'ask',    label:'外部インスペに打診', hint:'先方から日付が届いたらすぐ開始してOK'},
  {k:'fix',    label:'外部インスペ確定・カレンダー招待', auto:p=>extConfirmedIn(p.id).length>0},
  {k:'order',  label:'発注書を確認・押印して返送', hint:'1部屋15,000円／共用部2F分15,000円／外構15,000円'},
  {k:'report', label:'報告書を提出'},
  {k:'invoice',label:'請求書を作成'},
];
function taskDone(p,t){
  if(t.auto) return !!t.auto(p);
  return !!(S.tasks && S.tasks[p.id] && S.tasks[p.id][t.k]);
}
function toggleTask(pid,k){
  if(!S.tasks) S.tasks={};
  if(!S.tasks[pid]) S.tasks[pid]={};
  S.tasks[pid][k] = !S.tasks[pid][k];
  save(); render();
}
const taskCount = p => TASKS.filter(t=>taskDone(p,t)).length;
/* 打診がまだの物件（期間が決まっていて外部が未確定・未打診） */
function needsAsking(p){
  return p.status!=='完了' && p.start && !taskDone(p,TASKS[5]) && extConfirmedIn(p.id).length===0;
}
function taskList(p){
  const n = taskCount(p);
  return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center">
      <h2 style="margin:0">業務チェックリスト</h2>
      <div><b>${n}/${TASKS.length}</b> 完了
        <span class="bar"><i style="width:${Math.round(n/TASKS.length*100)}%"></i></span></div>
    </div>
    ${needsAsking(p)?`<div class="alert warn">まだ外部インスペへ打診していません。日付が届いているならすぐ打診してOKです。
      <button class="btn sm" onclick="go('msg')">打診文を開く</button></div>`:''}
    ${TASKS.map(t=>{
      const done = taskDone(p,t);
      return `<label class="task ${done?'done':''}" ${t.auto?'title="アプリの状態から自動で判定しています"':''}>
        <input type="checkbox" ${done?'checked':''} ${t.auto?'disabled':''} onchange="toggleTask('${p.id}','${t.k}')">
        <span>${t.label}${t.auto?' <span class="badge">自動</span>':''}
          ${t.hint?`<br><span class="muted">${t.hint}</span>`:''}</span></label>`;
    }).join('')}
  </div>`;
}

/* ---- OFF（休み・不在）---- */
const offOf = (mid,date) => S.offs.find(o=>o.memberId===mid && o.date===date);
function setOff(mid, start, end, reason){
  range(start,end).forEach(function(d){
    if(offOf(mid,d)) return;
    S.offs.push({id:uid(), memberId:mid, date:d, reason:reason||'OFF'});
  });
  save(); render();
}
function clearOff(mid, start, end){
  const ds = range(start,end);
  S.offs = S.offs.filter(o=> !(o.memberId===mid && ds.indexOf(o.date)>=0) );
  save(); render();
}
/* OFF日に既に入っているアサインを洗い出す */
function offConflicts(){
  return S.assignments.filter(a=>offOf(a.memberId,a.date));
}
function dropOffConflicts(){
  const ids = offConflicts().map(a=>a.id);
  S.assignments = S.assignments.filter(a=>ids.indexOf(a.id)<0);
  save(); render();
}
function offSummary(){
  const conf = offConflicts();
  const head = conf.length
    ? `<div class="alert err">⚠ OFFと重なっているアサインが${conf.length}件あります：`
      + conf.map(a=>`${M(a.memberId).name}さん ${fmt(a.date)}（${P(a.propertyId).name}）`).join('、')
      + ` <button class="btn sm danger" onclick="dropOffConflicts()">まとめて外す</button></div>`
    : '';
  if(!S.offs.length) return head + '<div class="muted" style="margin-top:10px">登録されているOFFはありません。</div>';
  const byM = {};
  S.offs.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(o=>{ (byM[o.memberId]=byM[o.memberId]||[]).push(o); });
  return head + Object.keys(byM).map(function(mid){
    const parts=[]; let cur=null;
    byM[mid].forEach(function(o){
      if(cur && cur.reason===o.reason && addDays(cur.end,1)===o.date){ cur.end=o.date; }
      else { cur={start:o.date,end:o.date,reason:o.reason}; parts.push(cur); }
    });
    return `<div class="reqrow"><b style="min-width:70px">${M(mid).name}</b>
      <span class="chips" style="flex:1;margin:0">${parts.map(b=>
        `<span class="chip" onclick="clearOff('${mid}','${b.start}','${b.end}')" title="クリックで解除">${b.start===b.end?fmt(b.start):fmt(b.start)+'〜'+fmt(b.end)}　${b.reason} ×</span>`).join('')}</span></div>`;
  }).join('');
}

/* ============================================================
   制約チェック（厳守ルール）
   ============================================================ */
function canConfirm(pid, mid, date){
  const p = P(pid), R = S.rules;
  if(!range(p.start,p.end).includes(date)) return {ok:false, why:'検査期間外'};

  const off = offOf(mid,date);
  if(off) return {ok:false, why:`${M(mid).name}さんは${off.reason}（${fmt(date)}）`};

  const dup = S.assignments.find(a=>a.memberId===mid && a.date===date && a.propertyId!==pid && a.status!=='requested');
  if(dup) return {ok:false, why:`他物件と重複（${P(dup.propertyId).name}）`};

  // 研修中は同行。1日2名の人数には数えないが、正規メンバー1名につき1名まで
  if(isTrainee(mid) && !R.countTrainees){
    const dayAll = onDay(pid,date);
    if(dayAll.some(a=>a.memberId===mid)) return {ok:true};
    const reg = dayAll.filter(a=>isRegular(a.memberId)).length;
    const trn = dayAll.filter(a=>isTrainee(a.memberId)).length;
    if(reg===0) return {ok:false, why:'この日はまだ正規メンバーがいません（研修は同行のみ）'};
    if(trn >= traineeCap(pid,date))
      return {ok:false, why:`研修中は正規${reg}名につき${traineeCap(pid,date)}名まで（この日は既に${trn}名）`};
    return {ok:true};
  }

  const day = booked(pid,date);
  const me  = day.find(a=>a.memberId===mid);

  if(isExt(mid)){
    const exts = extConfirmedIn(pid);
    if(!exts.includes(mid) && exts.length >= R.maxExternalPerProperty)
      return {ok:false, why:`外部インスペは1棟${R.maxExternalPerProperty}名まで（確定済: ${exts.map(i=>M(i).name).join('・')}）`};
    const extDay = day.filter(a=>isExt(a.memberId) && a.memberId!==mid).length;
    if(extDay >= R.maxExternalPerDay)
      return {ok:false, why:`この日は外部が既に${extDay}名（1日${R.maxExternalPerDay}名まで）`};
  }

  // 人数上限：自社の仮押さえは外して外部を入れられる（＝実運用の「自社の予定を消す」）
  const cap = R.maxPerDay;
  if(!me && day.length >= cap){
    const releasable = isExt(mid) && day.some(a=>a.status==='hold');
    if(!releasable) return {ok:false, why:`この日は満員（${day.length}/${cap}名）`};
  }
  return {ok:true};
}

function violations(pid){
  const p=P(pid), R=S.rules, out=[];
  const as = asgOf(pid).filter(counts);
  const days = range(p.start,p.end);
  const cap = R.maxPerDay;
  const need = needOf(p);

  const orphan = asgOf(pid).filter(a=>!days.includes(a.date));
  if(orphan.length) out.push({lv:'err', msg:`検査期間外のアサインが${orphan.length}件（${[...new Set(orphan.map(o=>fmt(o.date)))].join('、')}）`, orphan:true});

  const exts = extConfirmedIn(pid);
  if(exts.length > R.maxExternalPerProperty) out.push({lv:'err', msg:`外部インスペが${exts.length}名 確定（上限${R.maxExternalPerProperty}名）`});
  if(as.length < need) out.push({lv:'warn', msg:`のべ ${as.length}/${need}名 — あと${need-as.length}名ぶん未確保`});
  if(as.length > need) out.push({lv:'warn', msg:`のべ ${as.length}/${need}名 — ${as.length-need}名ぶん多く入っています`});
  if(need > days.length*cap) out.push({lv:'err', msg:`のべ${need}名は${days.length}日×${cap}名＝${days.length*cap}名ぶんに収まりません。期間を延ばすか人数を見直してください`});

  const offNg = asgOf(pid).filter(a=>offOf(a.memberId,a.date));
  offNg.forEach(a=>out.push({lv:'err', msg:`${fmt(a.date)} ${M(a.memberId).name}さんは${offOf(a.memberId,a.date).reason}です`}));

  days.forEach(d=>{
    const day = as.filter(a=>a.date===d);
    const ext = day.filter(a=>isExt(a.memberId)).length;
    if(ext > R.maxExternalPerDay) out.push({lv:'err', msg:`${fmt(d)} 外部${ext}名（上限${R.maxExternalPerDay}名）`});
    if(day.length > cap) out.push({lv:'err', msg:`${fmt(d)} 合計${day.length}名（1日${cap}名まで）`});
    if(!R.countTrainees){
      const dayAll = onDay(pid,d);
      const trn = dayAll.filter(a=>isTrainee(a.memberId)).length;
      const reg = dayAll.filter(a=>isRegular(a.memberId)).length;
      if(trn > reg*(R.traineesPerRegular||1))
        out.push({lv:'err', msg:reg===0
          ? `${fmt(d)} 研修中${trn}名だけになっています（同行する正規メンバーがいません）`
          : `${fmt(d)} 研修中${trn}名（正規${reg}名につき${reg*(R.traineesPerRegular||1)}名まで）`});
    }
  });
  const grads = S.members.filter(m=>m.trainee && propsDone(m.id) >= (R.graduateAfter||5));
  if(grads.length) out.push({lv:'warn', msg:`${grads.map(m=>m.name+'さん（'+propsDone(m.id)+'棟）').join('、')} が${R.graduateAfter}棟に到達しています。「メンバー / ルール」で研修のチェックを外すと正規メンバーになります`});
  return out;
}

/* ============================================================
   操作
   ============================================================ */
/* 管理者がボードのマスを押したとき */
function toggle(pid, mid, date){
  const ex = find(pid,mid,date);
  if(ex){ remove(ex); return; }
  const c = canConfirm(pid,mid,date);
  if(!c.ok) return alert('登録できません：' + c.why);
  add(pid,mid,date, isExt(mid)?'confirmed':'hold');
}
function add(pid,mid,date,status){
  S.assignments.push({id:uid(), propertyId:pid, memberId:mid, date, status});
  if(status==='confirmed' && isExt(mid)) releaseHolds(pid,date);
  save(); render();
}
function remove(a){ S.assignments = S.assignments.filter(x=>x!==a); save(); render(); }

/* 研修のON/OFF（成長段階。{棟数}棟で正規メンバーへ、スキルを見て戻すこともできる） */
function setTrainee(mid, on){
  const m = M(mid); if(!m) return;
  if(on && m.trainee) return;
  m.trainee = !!on;
  if(!on){
    // 正規メンバーになると1日の人数に数え始めるので、上限を超える日が出ないか確認する
    const over = [];
    S.assignments.filter(a=>a.memberId===mid && a.status!=='requested').forEach(a=>{
      if(booked(a.propertyId, a.date).length > S.rules.maxPerDay) over.push(`${P(a.propertyId).name} ${fmt(a.date)}`);
    });
    if(over.length) alert(`${m.name}さんを正規メンバーにしました。\n1日${S.rules.maxPerDay}名を超える日があります：\n・${[...new Set(over)].join('\n・')}`);
  }
  save(); render();
}

/* 外部が確定した日は、はみ出た自社の仮押さえを外す（＝Googleカレンダーの自社予定を削除） */
function releaseHolds(pid,date){
  const cap = S.rules.maxPerDay;
  let day = booked(pid,date);
  while(day.length > cap){
    const holds = day.filter(a=>a.status==='hold')
                     .sort((a,b)=> (M(b.memberId).load==='low') - (M(a.memberId).load==='low'));
    if(!holds.length) break;
    S.assignments = S.assignments.filter(x=>x!==holds[0]);
    day = booked(pid,date);
  }
}

/* 自社スタッフで仮押さえ。のべ必要人数に達するまで、負担が少ない人から満遍なく入れる */
function holdAll(pid){
  const p=P(pid), cap=S.rules.maxPerDay, need=needOf(p);
  const days = range(p.start,p.end);
  /* 満遍なく＝①対応少なめの人は後回し ②この棟に入っている日数が少ない人 ③全物件を通した稼働が少ない人 */
  const workload = mid => S.assignments.filter(a=>a.memberId===mid && a.status!=='requested').length;
  const inProp   = mid => asgOf(pid).filter(a=>a.memberId===mid).length;
  let guard = 0;
  while(totalBooked(pid) < need && guard++ < 200){
    let placed = false;
    for(const d of days){
      if(totalBooked(pid) >= need) break;
      if(booked(pid,d).length >= cap) continue;
      const cand = S.members.filter(m=>m.type==='internal' && !m.trainee && !find(pid,m.id,d) && canConfirm(pid,m.id,d).ok)
        .sort((a,b)=> (a.load==='low')-(b.load==='low') || inProp(a.id)-inProp(b.id) || workload(a.id)-workload(b.id));
      if(!cand.length) continue;
      S.assignments.push({id:uid(),propertyId:pid,memberId:cand[0].id,date:d,status:'hold'});
      placed = true;
    }
    if(!placed) break;   // これ以上入れられない
  }
  save(); render();
}

/* 申請 → 承認 / 却下 */
function request(pid,mid,date){
  const ex = find(pid,mid,date);
  if(ex){ if(ex.status==='requested') remove(ex); return; }
  S.assignments.push({id:uid(), propertyId:pid, memberId:mid, date, status:'requested'});
  save(); render();
}
function approve(id){
  const a = S.assignments.find(x=>x.id===id);
  const c = canConfirm(a.propertyId, a.memberId, a.date);
  if(!c.ok) return alert('承認できません：' + c.why);
  a.status='confirmed';
  releaseHolds(a.propertyId, a.date);
  save(); render();
}
function approveAllOf(pid,mid){
  asgOf(pid).filter(a=>a.memberId===mid && a.status==='requested')
    .sort((a,b)=>a.date<b.date?-1:1)
    .forEach(a=>{ if(canConfirm(pid,mid,a.date).ok){ a.status='confirmed'; releaseHolds(pid,a.date); } });
  save(); render();
}
function rejectAllOf(pid,mid){
  S.assignments = S.assignments.filter(a=>!(a.propertyId===pid && a.memberId===mid && a.status==='requested'));
  save(); render();
}

/* 工期変更 */
function changeTerm(pid, ns, ne){
  if(!ns||!ne||ns>ne) return alert('期間が正しくありません');
  const p=P(pid), old=`${p.start}〜${p.end}`;
  const days = range(ns,ne);
  const affected = asgOf(pid).filter(a=>!days.includes(a.date));
  p.start=ns; p.end=ne;
  p.history.push({at:new Date().toISOString().slice(0,16).replace('T',' '), from:old, to:`${ns}〜${ne}`, dropped:affected.length});
  save(); render();
  if(affected.length){
    const names=[...new Set(affected.filter(a=>isExt(a.memberId)).map(a=>M(a.memberId).name))];
    setTimeout(()=>alert(`工期を変更しました。\n新期間から外れたアサイン ${affected.length}件が「期間外」として残っています。\nチェック結果から一括解除できます。`+(names.length?`\n\n要連絡：${names.map(n=>n+'さん').join('、')}\n→「連絡文」タブに変更連絡の文面があります。`:'')),60);
  }
}
function dropOrphans(pid){
  const days = range(P(pid).start, P(pid).end);
  S.assignments = S.assignments.filter(a=> a.propertyId!==pid || days.includes(a.date));
  save(); render();
}

/* ============================================================
   画面：申請の承認
   ============================================================ */
function pendingList(){
  const out=[];
  S.properties.forEach(p=>{
    const reqs = asgOf(p.id).filter(a=>a.status==='requested');
    if(!reqs.length) return;
    const byM = {};
    reqs.forEach(a=>{ (byM[a.memberId]=byM[a.memberId]||[]).push(a); });
    out.push({p, byM});
  });
  return out;
}
function viewApprove(){
  const list = pendingList();
  if(!list.length) return backBar()+`<div class="card"><h2>申請の承認</h2><div class="alert ok">承認待ちの申請はありません。</div>
    <div class="muted">「予約画面（インスペさん）」タブから希望を出すと、ここに並びます。</div></div>`;

  return backBar() + list.map(({p,byM})=>{
    const cfm = extConfirmedIn(p.id), R=S.rules;
    const slots = R.maxExternalPerProperty - cfm.length;
    return `<div class="card">
      <h2>${p.name} <span class="badge st-${p.status}">${p.status}</span></h2>
      <div class="muted">${fmtLong(p.start)}〜${fmtLong(p.end)}　のべ ${totalBooked(p.id)}/${needOf(p)}名 確保済み</div>
      ${cfm.length?`<div class="alert ok">確定済み：${cfm.map(i=>M(i).name+'さん').join('、')}（残り枠 ${slots}名）</div>`
                  :`<div class="alert info">外部インスペの枠は ${R.maxExternalPerProperty}名です。誰にお願いするか選んでください。</div>`}
      ${Object.entries(byM).map(([mid,as])=>{
        const m=M(mid), ds=as.map(a=>a.date).sort();
        const blocked = !cfm.includes(mid) && slots<=0;
        return `<div class="reqrow">
          <b style="min-width:90px">${m.name}さん</b>
          <span class="muted">希望 ${ds.length}日</span>
          <span style="flex:1">${as.sort((a,b)=>a.date<b.date?-1:1).map(a=>{
              const c=canConfirm(p.id,mid,a.date);
              return c.ok
                ? `<button class="btn sm ok" style="margin:2px" onclick="approve('${a.id}')">${fmt(a.date)} を承認</button>`
                : `<button class="btn sm" style="margin:2px" disabled title="${c.why}">${fmt(a.date)}（${c.why}）</button>`;
            }).join('')}</span>
          <button class="btn sm pri" ${blocked?'disabled':''} onclick="approveAllOf('${p.id}','${mid}')">全て承認</button>
          <button class="btn sm danger" onclick="rejectAllOf('${p.id}','${mid}')">見送り</button>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function blocks(pid,mid){
  const ds = asgOf(pid).filter(a=>a.memberId===mid && a.status==='confirmed').map(a=>a.date).sort();
  const out=[]; let cur=null;
  ds.forEach(d=>{ if(cur && addDays(cur.end,1)===d){cur.end=d;} else {cur={start:d,end:d}; out.push(cur);} });
  return out;
}
const blkStr = b => b.start===b.end ? fmtLong(b.start) : `${fmtLong(b.start)}〜${fmtLong(b.end)}`;

/* ---- カレンダー（1日＝1予定。既定 9:00〜18:00） ---- */
/* カレンダーに入れる日。希望申請（未承認）は入れない */
const evDates = (pid,mid) => asgOf(pid).filter(a=>a.memberId===mid && a.status!=='requested')
                                       .map(a=>a.date).sort();
/* カレンダーに入れる人（自社の仮押さえも含む。並び順は表示と揃える） */
const evMembers = pid => S.members.filter(m=>evDates(pid,m.id).length);
/* 日本時間の h:mm を、そのままUTC表記の文字列にする（端末の時計に左右されない） */
function jstStamp(date, hm){
  const [y,mo,d]=date.split('-').map(Number), [h,mi]=hm.split(':').map(Number);
  const t = new Date(Date.UTC(y, mo-1, d, h-9, mi, 0));
  const z = n => String(n).padStart(2,'0');
  return `${t.getUTCFullYear()}${z(t.getUTCMonth()+1)}${z(t.getUTCDate())}T${z(t.getUTCHours())}${z(t.getUTCMinutes())}00Z`;
}
const evStart = d => jstStamp(d, S.rules.workStart||'09:00');
const evEnd   = d => jstStamp(d, S.rules.workEnd||'18:00');
function evDetail(p){
  return `物件: ${p.name}\n住所: ${p.address||''}\n規模: ${p.units||''}${p.report?`\n報告書: ${fmtLong(p.report)}まで`:''}\n主催: ${ORGANIZER}`;
}
function gcalUrl(p, m, date){
  const dates = `${evStart(date)}/${evEnd(date)}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(evTitle(p,m))}`
    + `&dates=${dates}&details=${encodeURIComponent(evDetail(p))}`
    + `&location=${encodeURIComponent(p.address||'')}`
    + (isExt(m.id)&&m.email?`&add=${encodeURIComponent(m.email)}`:'');
}

function cp(id,btn){ navigator.clipboard.writeText(document.getElementById(id).value); btn.textContent='コピーしました'; }
function downloadIcs(pid){
  const p=P(pid); const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LTS//sched//JA'];
  evMembers(pid).forEach(m=>{
    evDates(pid,m.id).forEach(d=>{

        `DTSTART:${evStart(d)}`,
        `DTEND:${evEnd(d)}`,
        `SUMMARY:${evTitle(p,m)}`,
        `DESCRIPTION:${evDetail(p).replace(/\n/g,'\\n')}`,
        `LOCATION:${p.address||''}`,
        `ORGANIZER;CN=${SENDER}:mailto:${ORGANIZER}`);
      if(isExt(m.id) && m.email) out.push(`ATTENDEE;CN=${m.name};RSVP=TRUE:mailto:${m.email}`);
      out.push('END:VEVENT');
    });
  });
  out.push('END:VCALENDAR');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out.join('\r\n')],{type:'text/calendar'}));
  a.download=`${p.name}.ics`; a.click();
}

/* ============================================================
   画面：メンバー / ルール
   ============================================================ */

    </div>
    <div class="muted">使える差し込み：<span class="mono">{名前} {元請け} {コード} {コード＋報告書} {報告書} {住所} {物件名}</span>

  <div class="card"><h2>メンバー</h2>

    </div>
    ${offSummary()}
  </div>
  <div class="card"><h2>データ</h2>
    <div class="alert warn">データはこの端末のブラウザの中だけに保存されています。サーバー版になるまでは、

      <button class="btn pri" onclick="backup()">バックアップを保存</button>

        <input type="file" accept="application/json,.json" style="display:none" onchange="restore(this)"></label>

  <div class="card"><h2>オフライン利用</h2>
    <div class="muted">一度開いておけば、Wi-Fiが無い場所でもそのまま使えます。<br>

      ・<b>Android</b>：Chromeのメニュー →「アプリをインストール」<br>
      ・<b>PC</b>：アドレスバー右側のインストールアイコン、または上の「アプリとして追加」ボタン<br>

/* ============================================================
   ルーティング
   ============================================================ */
const TABS = {board:viewBoard, approve:viewApprove, props:viewProps, book:viewBook, msg:viewMsg, members:viewMembers};
const TAB_NAME = {board:'調整ボード', approve:'申請の承認', props:'物件一覧', book:'予約画面', msg:'連絡文・カレンダー', members:'メンバー / ルール'};
let TAB='board', HIST=[];
function go(t){ if(t!==TAB){ HIST.push(TAB); if(HIST.length>20) HIST.shift(); } TAB=t; render(); }
function back(){ TAB = HIST.pop() || 'props'; render(); }
/* 直前の画面へ戻るリンク（物件を選んで入ってきたときの「戻る」） */
function backBar(){
  if(!HIST.length) return '';
  const prev = HIST[HIST.length-1];
  return `<button class="back" onclick="back()">← ${TAB_NAME[prev]}に戻る</button>`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){
  Object.keys(TABS).forEach(t=>{ document.getElementById('tab-'+t).hidden = t!==TAB; });
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===TAB));
  document.getElementById('appTitle').textContent = (D.clientName? D.clientName+' ':'')+'内覧会 スケジュール調整';
  document.getElementById('ruleTag').textContent = `1日${S.rules.maxPerDay}名 / 外部 1棟${S.rules.maxExternalPerProperty}名・1日${S.rules.maxExternalPerDay}名`;
  const n = S.assignments.filter(a=>a.status==='requested').length;
  const el = document.getElementById('nReq'); el.textContent = n||''; el.style.display = n?'':'none';
  document.getElementById('tab-'+TAB).innerHTML = TABS[TAB]();
  showNet();
  if(window.SYNC && SYNC.renderPanel) SYNC.renderPanel();
}

/* 初回起動時は data.js の既存スケジュールを読み込む */
if(FRESH){
  const today = d2s(new Date());
  PAPAMAHALO.forEach(function(r){
    const e = expand(r, today);
    S.properties.push(e.prop);
    e.asg.forEach(function(a){ S.assignments.push(a); });
  });
  save();
}
/* ============================================================
   オフライン対応（サービスワーカー）とアプリ追加
   ============================================================ */
function showNet(){
  const el = document.getElementById('netTag');
  const on = navigator.onLine;
  el.textContent = on ? 'オンライン' : 'オフラインで動作中';
  el.style.background = on ? '#374151' : '#7c2d12';
}
window.addEventListener('online', showNet);
window.addEventListener('offline', showNet);
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW登録に失敗', e); });
  });
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').hidden = false;
});
function doInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt=null; document.getElementById('installBtn').hidden=true; });
}
window.addEventListener('appinstalled', function(){ document.getElementById('installBtn').hidden = true; });

/* ---- バックアップ / 復元（データはこの端末の中だけにあります）---- */
function backup(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='内覧会スケジュール_backup_'+d2s(new Date())+'.json'; a.click();
}
function restore(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      if(!d.properties||!d.members) throw new Error('形式が違います');
      if(!confirm('現在のデータを、選んだファイルの内容で置き換えます。よろしいですか？')) return;
      S=d; S.rules={...RULES_DEFAULT,...S.rules};
      if(!S.offs) S.offs=[]; if(!S.tasks) S.tasks={};
      save(); render(); alert('復元しました。');
    }catch(e){ alert('読み込めませんでした：'+e.message); }
  };
  r.readAsText(f);
}

if(!P(S.ui.curProp) && S.properties.length){
  const up = S.properties.slice().sort((a,b)=>a.start<b.start?-1:1).filter(p=>p.status!=='完了');
  S.ui.curProp = (up[0]||S.properties[0]).id;
}
render();
</script>
